name: renmember

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renmember}
      POSTGRES_USER: ${POSTGRES_USER:-renmember}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renmember_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Renmember: Host=db;Port=5432;Database=${POSTGRES_DB:-renmember};Username=${POSTGRES_USER:-renmember};Password=${POSTGRES_PASSWORD:-renmember_dev};GSS Encryption Mode=Disable
      SeededUser__TimeZone: ${USER_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  db-data:
