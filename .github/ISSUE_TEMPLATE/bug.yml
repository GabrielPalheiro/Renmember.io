name: Defeito
description: Algo que não funciona como deveria
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abrir o kanban
        2. Arrastar uma atividade para "Feito"
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: obtido
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão
      placeholder: "v0.3.1"
